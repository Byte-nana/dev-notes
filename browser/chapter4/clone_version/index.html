<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping list clone coding</title>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <!-- font aswesom -->
    <script
      src="https://kit.fontawesome.com/a5f079a000.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section class="list">
      <header class="header">shopping list</header>
      <ul class="items">
        <li class="item__row">
          <div class="item">
            <span class="item__name">Egg</span>
            <button class="item__delete">
              <i class="fa-solid fa-eraser"></i>
            </button>
          </div>
          <div class="item__divider"></div>
        </li>
      </ul>
      <footer class="footer">
        <form action="" class="new__form">
          <input type="text" class="footer__input" />
          <button type="submit" class="footer__button">
            <i class="fa-solid fa-pencil"></i>
          </button>
        </form>
      </footer>
    </section>
  </body>
</html>
