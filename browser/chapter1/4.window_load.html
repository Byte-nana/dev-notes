<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Window load</title>
    <!-- defer: html을 parsing하는 동안 필요한 자바스크립트를 다 다운받고, html 다운이 완료되면 자바스크립트를 실행한다. -->
    <script src="/chapter1/test.js" defer></script>
  </head>
  <body>
    <script>
      // DOMContentLoaded: only documnet, HTML만 다 완료되면 호출된다.
      window.addEventListener('DOMContentLoaded', () => {
        console.log('DOMContentLoaded');
      });

      //load: after resources (css, images), css나 모든 것들이 다 완료되면 호출된다.
      window.addEventListener('load', () => {
        console.log('load');
      });

      //before unload: 사용자가 페이지를 나가기 전에 호출이 된다.
      window.addEventListener('beforeunload', () => {
        console.log('beforeunload');
      });

      //resource is being unloaded
      window.addEventListener('unload', () => {
        console.log('unload');
      });
    </script>
  </body>
</html>
