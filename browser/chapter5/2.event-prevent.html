<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <브라우저의 기본 기능 취소하기> -->
    <style>
      div {
        width: 250px;
        height: 250px;
        background-color: yellow;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div>
      <input type="checkbox" />
    </div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <script>
      document.addEventListener(
        'wheel',
        (event) => {
          console.log('scrolling');
          // 브라우저에서 기본적으로 발생하는 동작을 취소한다.
          // 스크롤링과 같은 passive target의 경우, 이를 사용할 수 없고 에러가 발생한다.
          event.preventDefault();
        },
        // pssive: false로 바꾸어 주면 preventDefault를 호출할 수 있다. 하지만 기본적으로 passive가 true로 설정되어있는 경우, 이를 바꾸는 것은 좋지 않다.
        { passive: false }
      );
      const checkbox = document.querySelector('input');
      checkbox.addEventListener('click', (event) => {
        console.log('checked');
        // 브라우저에서 기본적으로 발생하는 동작을 취소한다.
        // checkbox의 경우, 마우스로 클릭하면 체크가 표시되는데, 이것이 더이상 나타나지 않게 된다.
        event.preventDefault();
      });
    </script>
  </body>
</html>
